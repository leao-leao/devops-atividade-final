replicaCount: 2

image:
  repository: ghcr.io/SEU-USUARIO/SEU-REPO
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

ingress:
  enabled: false
  className: nginx
  host: tarefas.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
